---
# Agora Platform Configuration for customized agent 100106.
#
# This file is intentionally copied from the regular Agora platform flow and
# only changes the post-login enter path. The original agora.yaml remains the
# stable baseline.
name: agora-100106
description: Agora Conversational AI customized agent 100106
config:
  home_url: https://conversational-ai.agora.io/
  sso_login_url: https://sso2.agora.io/_/login
  agent_id: "100106"
auth:
  default_mode: auto
  auto_fallback: [ storage, account, manual ]
actions:
  setup:account:
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: load

    - type: control.sleep
      duration: 3000

    - type: browser.click
      selector: button:has-text('Log in or Sign up')
      timeout_ms: 10000

    - type: control.sleep
      duration: 2000

    - type: browser.click
      selector: button:has-text('Agree')
      timeout_ms: 10000

    - type: control.sleep
      duration: 1000

    - type: browser.set_checkbox
      selector: button[role='checkbox'][id='terms']
      checked: true
      timeout_ms: 10000

    - type: browser.click
      selector: button:has-text('Log in with Agora account')
      timeout_ms: 10000

    - type: browser.wait_for_element
      selector: input[type='email'][placeholder='Enter email']
      state: visible
      timeout_ms: 15000

    - type: browser.fill
      selector: input[type='email'][placeholder='Enter email']
      value: ${params.email}
      timeout_ms: 15000

    - type: browser.fill
      selector: input[type='password'][placeholder='Enter password']
      value: ${params.password}
      timeout_ms: 15000

    - type: control.sleep
      duration: 1000

    - type: browser.wait_for_element
      selector: button:has-text('Sign In'):not([disabled])
      state: visible
      timeout_ms: 15000

    - type: browser.click
      selector: button:has-text('Sign In')

    - type: browser.wait_for_url
      pattern: ${config.home_url}
      timeout_ms: 60000

    - type: control.sleep
      duration: 3000

    - type: browser.save_storage_state
      file: ${params.storage_file}

    - type: control.log
      message: Agora 100106 setup completed (account mode)

  setup:storage:
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: load

    - type: control.sleep
      duration: 2000

    - type: browser.load_storage_state
      file: ${params.storage_file}

    - type: browser.refresh
      timeout_ms: 30000

    - type: control.sleep
      duration: 3000

    - type: browser.wait_for_url
      pattern: ${config.home_url}
      timeout_ms: 10000

    - type: browser.click
      selector: button:has-text('Agree')
      timeout_ms: 5000
      required: false

    - type: control.log
      message: Agora 100106 setup completed (storage mode)

  setup:manual:
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: load

    - type: control.sleep
      duration: 3000

    - type: control.log
      message: Please complete login in the browser window

    - type: control.log
      message: Waiting for login completion (user avatar button should appear)...

    - type: browser.wait_for_element
      selector: button:has(svg circle[cx="16"])
      state: visible
      timeout_ms: 300000

    - type: control.log
      message: Login detected (user avatar appeared), saving state...

    - type: control.sleep
      duration: 3000

    - type: browser.save_storage_state
      file: ${params.storage_file}

    - type: control.log
      message: Storage state saved

  # The auth storage for this platform is expected to include the custom
  # 100106 agent in localStorage. Open the Agent panel first because the
  # default headful viewport keeps the panel outside the visible area.
  enter:
    - type: browser.click
      selector: button:has-text('Agree')
      timeout_ms: 2000
      required: false

    - type: browser.click
      selector: button:has(svg.lucide-settings2)
      timeout_ms: 10000

    - type: browser.wait_for_element
      selector: "text=[100106]"
      state: visible
      timeout_ms: 30000

    - type: browser.click
      selector: "${params.agent_selector:-text=new turbo trial}"
      timeout_ms: 30000
      force: true

    - type: browser.click
      selector: button:has-text('Call AI Engine')
      timeout_ms: 10000

    - type: control.log
      message: Agora conversation started with customized agent 100106

  wait_for_active:
    - type: browser.wait_for_element
      selector: button.text-destructive:has(svg.lucide-x):not([disabled])
      state: visible
      timeout_ms: 30000

    - type: control.sleep
      duration: 1000

    - type: control.log
      message: Agora customized agent 100106 conversation active

  exit:
    - type: browser.wait_for_element
      selector: button.text-destructive:has(svg.lucide-x):not([disabled])
      state: visible
      timeout_ms: 10000

    - type: browser.click
      selector: button.text-destructive:has(svg.lucide-x)
      timeout_ms: 10000

    - type: control.sleep
      duration: 2000

    - type: control.log
      message: Agora customized agent 100106 conversation ended

agents:
  - id: "100106"
    name: Customized Agent 100106
    description: Retrieved from Custom Agent by ID
