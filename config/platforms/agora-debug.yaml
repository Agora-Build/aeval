---
# Agora Debug Platform Configuration
#
# Platform: Agora Conversational AI (Debug Deployment)
# URL: https://convoai-web-custom-20260618.la3.agoralab.co/
# Authentication: Required (email/password or storage state)
#
# Setup Modes:
#   - storage: Use saved storage state (fastest)
#   - account: Login with email and password (SSO)
#   - manual: Manual login in browser window
name: agora-debug
description: Agora Conversational AI Debug Deployment
config:
  home_url: https://convoai-web-custom-20260618.la3.agoralab.co/
  sso_login_url: https://sso2.agora.io/_/login
  ignore_https_errors: true
audio_io:
  mode: soundcard
  soundcard:
    backend: auto
auth:
  default_mode: auto
  auto_fallback: [ storage, account, manual ]
actions:
  setup:account:
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: domcontentloaded
    - type: control.sleep
      duration: 3000
    - type: browser.click
      selector: button:has-text('Log in or Sign up')
      timeout_ms: 10000
    - type: control.sleep
      duration: 2000
    - type: browser.click
      selector: button:has-text('Agree')
      timeout_ms: 10000
      required: false
    - type: control.sleep
      duration: 1000
    - type: browser.set_checkbox
      selector: button[role='checkbox'][id='terms']
      checked: true
      timeout_ms: 10000
    - type: browser.click
      selector: button:has-text('Log in with Agora account')
      timeout_ms: 10000
    - type: browser.wait_for_element
      selector: input[type='email'][placeholder='Enter email']
      state: visible
      timeout_ms: 15000
    - type: browser.fill
      selector: input[type='email'][placeholder='Enter email']
      value: ${params.email}
      timeout_ms: 15000
    - type: browser.fill
      selector: input[type='password'][placeholder='Enter password']
      value: ${params.password}
      timeout_ms: 15000
    - type: control.sleep
      duration: 1000
    - type: browser.wait_for_element
      selector: button:has-text('Sign In'):not([disabled])
      state: visible
      timeout_ms: 15000
    - type: browser.click
      selector: button:has-text('Sign In')
    - type: browser.wait_for_url
      pattern: ${config.home_url}
      timeout_ms: 60000
    - type: control.sleep
      duration: 3000
    - type: browser.save_storage_state
      file: ${params.storage_file}
    - type: control.log
      message: Agora debug setup completed (account mode)

  setup:storage:
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: domcontentloaded
    - type: control.sleep
      duration: 2000
    - type: browser.load_storage_state
      file: ${params.storage_file}
    - type: browser.refresh
      timeout_ms: 30000
    - type: control.sleep
      duration: 3000
    - type: browser.wait_for_url
      pattern: ${config.home_url}
      timeout_ms: 10000
    - type: browser.click
      selector: button:has-text('Agree')
      timeout_ms: 3000
      required: false
    - type: control.log
      message: Agora debug setup completed (storage mode)

  setup:manual:
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: domcontentloaded
    - type: control.sleep
      duration: 3000
    - type: control.log
      message: ⏸️  Please complete login in the browser window
    - type: control.log
      message: Waiting for login completion (user avatar button should appear)...
    - type: browser.wait_for_element
      selector: button:has(svg circle[cx="16"])
      state: visible
      timeout_ms: 300000
    - type: control.log
      message: ✅ Login detected (user avatar appeared), saving state...
    - type: control.sleep
      duration: 3000
    - type: browser.save_storage_state
      file: ${params.storage_file}
    - type: control.log
      message: ✅ Storage state saved

  enter:
    - type: browser.click
      selector: button:has-text('Call AI Engine')
      timeout_ms: 10000
    - type: control.log
      message: Agora debug conversation started

  enter:select_agent:
    - type: browser.click
      selector: button:has-text('${params.agent_name}')
      timeout_ms: 10000
    - type: browser.click
      selector: button:has-text('Call AI Engine')
      timeout_ms: 10000
    - type: control.log
      message: 'Agora debug conversation started with agent: ${params.agent_name}'

  wait_for_active:
    - type: browser.wait_for_element
      selector: button.text-destructive:has(svg.lucide-x):not([disabled])
      state: visible
      timeout_ms: 30000
    - type: control.sleep
      duration: 1000
    - type: control.log
      message: Agora debug conversation active

  exit:
    - type: browser.wait_for_element
      selector: button.text-destructive:has(svg.lucide-x):not([disabled])
      state: visible
      timeout_ms: 10000
    - type: browser.click
      selector: button.text-destructive:has(svg.lucide-x)
      timeout_ms: 10000
    - type: control.sleep
      duration: 2000
    - type: control.log
      message: Agora debug conversation ended

agents:
  - name: Assistant
    description: Default assistant
  - name: The Astrologer
    description: Astrology assistant
  - name: Penny (beta)
    description: Beta assistant
  - name: Echo Assistant
    description: Echo assistant
  - name: Vision
    description: Vision assistant
  - name: Customer Service - Phone In
    description: Inbound customer service
  - name: Customer Service - Phone Out
    description: Outbound customer service
