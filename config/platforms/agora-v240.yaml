---
# Agora Platform Configuration
#
# Platform: Agora Conversational AI (International)
# URL: https://staging-convoai-global.la3.agoralab.co/
# Authentication: Required (email/password or storage state)
#
# Setup Modes:
#   - storage: Use saved storage state (fastest)
#   - account: Login with email and password (SSO)
#   - manual: Manual login in browser window
name: agora-v240
description: Agora v2.4.0 staging demo (English, Voiceprint Lock Off)
config:
  home_url: https://staging-convoai-global.la3.agoralab.co/
  auth_storage_platform: agora-staging
  sso_login_url: https://sso2.agora.io/_/login  # May vary by language (/_/login, /en/login, etc.)
audio_io:
  mode: soundcard
  soundcard:
    backend: auto
    # Limit Linux Chromium playback batches to mitigate periodic AI PCM zero tails.
    chromium_audio_buffer_size: 512
  recording:
    source: native_loopback
    format: wav_float32
    sample_rate: 48000
    channel_layout: user_left_agent_right
    preview: none
auth:
  default_mode: auto
  auto_fallback: [ storage, account, manual ]
# Platform actions
actions:
  # ========== Setup Actions ==========
  # Setup (Default): Email/password login (SSO)
  setup:account:
    # 1. Navigate to home page
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: load

    # 2. Wait for page to fully initialize
    - type: control.sleep
      duration: 3000

    # 3. Click "Log in or Sign up" button
    - type: browser.click
      selector: button:has-text('Log in or Sign up')
      timeout_ms: 10000

    # 4. Wait for popup content to load
    - type: control.sleep
      duration: 2000

    # 5. Agree to privacy policy popup
    - type: browser.click
      selector: button:has-text('Agree')
      timeout_ms: 10000

    # 6. Wait for agreement form to load
    - type: control.sleep
      duration: 1000

    # 7. Ensure agreement checkbox is checked
    - type: browser.set_checkbox
      selector: button[role='checkbox'][id='terms']
      checked: true
      timeout_ms: 10000

    # 8. Click login button to enter SSO page
    - type: browser.click
      selector: button:has-text('Log in with Agora account')
      timeout_ms: 10000

    # 9. Wait for the new SSO form to load
    - type: browser.wait_for_element
      selector: input[type='email'][placeholder='Enter email']
      state: visible
      timeout_ms: 15000

    # 10. Fill email
    - type: browser.fill
      selector: input[type='email'][placeholder='Enter email']
      value: ${params.email}
      timeout_ms: 15000

    # 11. Fill password
    - type: browser.fill
      selector: input[type='password'][placeholder='Enter password']
      value: ${params.password}
      timeout_ms: 15000
    - type: control.sleep
      duration: 1000

    # 12. Wait for sign-in button to become enabled
    - type: browser.wait_for_element
      selector: button:has-text('Sign In'):not([disabled])
      state: visible
      timeout_ms: 15000

    # 13. Submit sign-in form
    - type: browser.click
      selector: button:has-text('Sign In')

    # 14. Wait for redirect back to home page
    - type: browser.wait_for_url
      pattern: ${config.home_url}
      timeout_ms: 60000

    # 15. Wait for page to fully load and stabilize
    - type: control.sleep
      duration: 3000

    # 16. Save storage state
    - type: browser.save_storage_state
      file: ${params.storage_file}
    - type: control.log
      message: Agora setup completed (account mode)

  # Setup (Storage State Mode): Use saved storage state to login
  setup:storage:
    # 1. Navigate to home page
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: domcontentloaded

    # 2. Wait for initial page load
    - type: control.sleep
      duration: 2000

    # 3. Load storage state
    - type: browser.load_storage_state
      file: ${params.storage_file}

    # 4. Revisit the app to apply login state without waiting on remote assets
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: domcontentloaded
      timeout_ms: 30000

    # 5. Allow the app to initialize after navigation
    - type: control.sleep
      duration: 3000

    # 6. Verify login state
    - type: browser.wait_for_url
      pattern: ${config.home_url}
      timeout_ms: 10000

    - type: browser.wait_for_element
      selector: "xpath=//button[normalize-space(.)='Assistant']"
      state: visible
      timeout_ms: 30000

    # 7. Close privacy popup if it appears (first time after login).
    # The popup can render a bit late after refresh, so enter retries once more.
    - type: browser.click
      selector: button:has-text('Agree')
      timeout_ms: 5000
      required: false
    - type: control.log
      message: Agora setup completed (storage mode)

  # Setup (Manual Mode): User completes login manually
  setup:manual:
    # 1. Navigate to home page
    - type: browser.navigate
      url: ${config.home_url}
      wait_until: load
    - type: control.sleep
      duration: 3000
    - type: control.log
      message: ⏸️  Please complete login in the browser window
    - type: control.log
      message: Waiting for login completion (Assistant agent button should appear)...
    # 2. Agent selection is only available after login on staging.
    - type: browser.wait_for_element
      selector: "button:has-text('Assistant')"
      state: visible
      timeout_ms: 600000
    - type: control.log
      message: ✅ Login detected (Assistant agent available), saving state...
    - type: control.sleep
      duration: 3000
    # 3. Save storage state
    - type: browser.save_storage_state
      file: ${params.storage_file}
    - type: control.log
      message: ✅ Storage state saved

  # ========== Enter Actions ==========
  # Enter (Default): Use default agent ("Assistant")
  enter:
    # Retry dismissing the privacy popup in case it appears after setup completed.
    - type: browser.click
      selector: button:has-text('Agree')
      timeout_ms: 2000
      required: false

    # Always use the default Assistant, regardless of saved page selection.
    - type: browser.click
      selector: "xpath=//button[normalize-space(.)='Assistant']"
      timeout_ms: 10000

    # Configure the conversation before starting it. Playwright clicks scroll
    # the target into view, including the Advanced Settings section.
    # A collapsed sidebar keeps its tabs in the DOM; check its zero-width
    # container rather than :visible, which also matches those off-screen tabs.
    - &open_settings_panel
      type: browser.click
      selector: "body:has(.w-0 [role='tab']:has-text('Settings')) button:has(svg.lucide-settings2)"
      timeout_ms: 2000
      required: false
    - &select_settings_tab
      type: browser.click
      selector: "[role='tab']:has-text('Settings')"
      timeout_ms: 10000
    - &open_language_dropdown
      type: browser.click
      selector: "xpath=//*[normalize-space(text())='Language']/ancestor::*[.//*[@role='combobox']][1]//*[@role='combobox']"
      timeout_ms: 10000
    - &select_english
      type: browser.click
      selector: "[role='option']:has-text('English')"
      timeout_ms: 10000
    - &verify_english
      type: browser.wait_for_element
      selector: "[role='combobox']:has-text('English')"
      state: visible
      timeout_ms: 10000
    - &open_voiceprint_settings
      type: browser.click
      selector: "xpath=//*[normalize-space(text())='Advanced Settings']/ancestor::*[.//*[normalize-space(text())='Voiceprint Lock']][1]//*[normalize-space(text())='Voiceprint Lock']"
      timeout_ms: 10000
    - &disable_voiceprint_lock
      type: browser.click
      selector: ":text-is('Off'):visible"
      timeout_ms: 10000
    - &verify_voiceprint_off
      type: browser.wait_for_element
      selector: "xpath=//*[normalize-space(text())='Off']/ancestor::*[.//*[@role='checkbox']][1]//*[@role='checkbox' and @aria-checked='true']"
      state: visible
      timeout_ms: 10000
    - &close_voiceprint_settings
      type: browser.click
      selector: "xpath=//*[normalize-space(text())='Off']/ancestor::*[.//*[normalize-space(text())='Seamless Mode']][1]//*[normalize-space(text())='Voiceprint Lock']/parent::*//button"
      timeout_ms: 10000

    # Click "Call AI Engine" button
    - type: browser.click
      selector: button:has-text('Call AI Engine')
      timeout_ms: 10000

    - type: control.log
      message: Agora conversation started

  # Enter (Select agent mode): Select specified agent
  enter:select_agent:
    # Click specified agent
    - type: browser.click
      selector: button:has-text('${params.agent_name}')
      timeout_ms: 10000

    # Apply the same pre-call settings after selecting the agent.
    - *open_settings_panel
    - *select_settings_tab
    - *open_language_dropdown
    - *select_english
    - *verify_english
    - *open_voiceprint_settings
    - *disable_voiceprint_lock
    - *verify_voiceprint_off
    - *close_voiceprint_settings

    # Click "Call AI Engine" button
    - type: browser.click
      selector: button:has-text('Call AI Engine')
      timeout_ms: 10000

    - type: control.log
      message: 'Agora conversation started with agent: ${params.agent_name}'

  # Active check: the close button appears only after the conversation is connected.
  wait_for_active:
    - type: browser.wait_for_element
      selector: button.text-destructive:has(svg.lucide-x):not([disabled])
      state: visible
      timeout_ms: 30000
    - type: control.sleep
      duration: 1000
    - type: control.log
      message: Agora conversation active

  # ========== Exit Actions ==========
  # Exit (Default): Click close button
  exit:
    # Wait for close button to be visible and enabled
    - type: browser.wait_for_element
      selector: button.text-destructive:has(svg.lucide-x):not([disabled])
      state: visible
      timeout_ms: 10000

    # Click close button
    - type: browser.click
      selector: button.text-destructive:has(svg.lucide-x)
      timeout_ms: 10000

    # Wait for conversation to end
    - type: control.sleep
      duration: 2000
    - type: control.log
      message: Agora conversation ended
# Available Agents (for reference)
agents:
  - name: Assistant
    description: Default assistant
  - name: The Astrologer
    description: Astrology assistant
  - name: Penny (beta)
    description: Beta assistant
  - name: Echo Assistant
    description: Echo assistant
  - name: Vision
    description: Vision assistant
  - name: Customer Service - Phone In
    description: Inbound customer service
  - name: Customer Service - Phone Out
    description: Outbound customer service
