---
# ElevenLabs Platform Configuration
#
# Platform: ElevenLabs (11.ai)
# Authentication: Optional public demo, or account/storage state for app agents
#
# Setup Modes:
#   - storage: Use saved storage state (fastest)
#   - account: Login with email and password
#   - public: Public ElevenAgents demo (no login required)
#   - manual: Manual login in browser window
#
# Note: CAPTCHA may appear during account login. Use manual mode if needed.
name: elevenlabs
description: ElevenLabs AI Voice Conversation Platform
config:
  url: https://elevenlabs.io/app/agents
  public_url: https://elevenlabs.io/agents
  sign_in_url: https://elevenlabs.io/app/sign-in?redirect=%2Fapp%2Fagents
  agent_url: https://elevenlabs.io/app/agents/agents/agent_6001kadq6pv0f598pjx96ahaxvsq
auth:
  default_mode: auto
  auto_fallback: [ storage, account, public, manual ]
mode_routes:
  public:
    setup: public
    enter: public
    exit: public
  account:
    setup: account
    enter: agent_url
  storage:
    setup: storage
    enter: agent_url
  manual:
    setup: manual
    enter: select_agent
actions:
  # ==========================================================================
  # Setup Actions (Authentication)
  # ==========================================================================

  # Storage Mode: Use saved storage state (fastest)
  setup:storage:
    - type: browser.navigate
      url: ${config.url}
      wait_until: domcontentloaded
      timeout_ms: 60000
    - type: control.sleep
      duration: 3000
    - type: browser.load_storage_state
      file: ${params.storage_file}
    - type: browser.refresh
      timeout_ms: 60000
    - type: control.sleep
      duration: 5000
    - type: browser.wait_for_url
      pattern: ${config.url}
      timeout_ms: 10000
    - type: browser.click
      selector: button:has-text('Reject all')
      timeout_ms: 5000
      required: false
    - type: browser.navigate
      url: ${params.agent_url:-}
      wait_until: domcontentloaded
      timeout_ms: 60000
    - type: browser.wait_for_url
      pattern: "**/app/agents/agents/**"
      timeout_ms: 30000
    - type: control.log
      message: ElevenLabs setup completed (storage mode)

  # Account Mode: Login with email and password
  setup:account:
    - type: browser.navigate
      url: ${config.url}
      wait_until: domcontentloaded
      timeout_ms: 60000
    - type: browser.wait_for_url
      pattern: '**/app/sign-in**'
      timeout_ms: 60000
    - type: browser.wait_for_element
      selector: input[data-testid='sign-in-email-input']
      timeout_ms: 30000
    - type: browser.fill
      selector: input[data-testid='sign-in-email-input']
      value: ${params.email}
      timeout_ms: 10000
    - type: browser.fill
      selector: input[data-testid='sign-in-password-input']
      value: ${params.password}
      timeout_ms: 10000
    - type: control.sleep
      duration: 1000
    - type: browser.click
      selector: button[data-testid='sign-in-submit-button']
      timeout_ms: 10000
    - type: browser.wait_for_url
      pattern: '**/app/agents**'
      timeout_ms: 60000
    - type: control.sleep
      duration: 3000
    - type: browser.click
      selector: button:has-text('Reject all')
      timeout_ms: 5000
      required: false
    - type: browser.navigate
      url: ${params.agent_url:-}
      wait_until: domcontentloaded
      timeout_ms: 60000
    - type: browser.wait_for_url
      pattern: "**/app/agents/agents/**"
      timeout_ms: 30000
    - type: browser.save_storage_state
      file: ${params.storage_file}
    - type: control.log
      message: ElevenLabs setup completed (account mode)

  # Public Mode: Open public ElevenAgents demo (no login required)
  setup:public:
    - type: browser.navigate
      url: ${config.public_url}
      wait_until: load
      timeout_ms: 60000
    - type: browser.wait_for_element
      selector: button:has-text('Talk to an agent')
      timeout_ms: 60000
    - type: browser.click
      selector: button:has-text('Reject all')
      timeout_ms: 5000
      required: false
    - type: control.log
      message: ElevenLabs setup completed (public mode)

  # Manual Mode: User completes login manually
  setup:manual:
    - type: browser.navigate
      url: ${config.sign_in_url}
      wait_until: domcontentloaded
      timeout_ms: 60000
    - type: control.sleep
      duration: 3000
    - type: control.log
      message: ⏸️  Please complete login in the browser window
    - type: control.log
      message: Waiting for login completion (redirect to ElevenAgents app)...
    # Wait for successful login (redirect to ElevenAgents app)
    - type: browser.wait_for_url
      pattern: '**/app/agents**'
      timeout_ms: 300000
    - type: browser.click
      selector: button:has-text('Reject all')
      timeout_ms: 5000
      required: false
    - type: control.log
      message: ✅ Login detected (redirected to ElevenAgents app), saving state...
    - type: control.sleep
      duration: 3000
    - type: browser.save_storage_state
      file: ${params.storage_file}
    - type: control.log
      message: ✅ Storage state saved

  # ==========================================================================
  # Conversation Actions
  # ==========================================================================

  # Enter: Public demo widget
  enter:public:
    - type: browser.click
      selector: button:has-text('Talk to an agent')
      timeout_ms: 10000
    - type: browser.wait_for_element
      selector: button[aria-label='Start call']
      timeout_ms: 30000
    - type: browser.click
      selector: button[aria-label='Start call']
      timeout_ms: 10000
    - type: browser.wait_for_element
      selector: button:has-text('I agree')
      timeout_ms: 30000
    - type: browser.click
      selector: button:has-text('I agree')
      timeout_ms: 10000
      required: true
    - type: control.sleep
      duration: 5000
    - type: control.log
      message: ElevenLabs conversation started (public mode)

  # Enter with agent selection
  enter:select_agent:
    - type: browser.click
      selector: "button:visible:has([data-agent-tooltip='${params.agent_name}'])"
      timeout_ms: 10000
    - type: browser.wait_for_url
      pattern: "**/app/agents/agents/**"
      timeout_ms: 30000
    - type: browser.wait_for_element
      selector: "a:has-text('Preview'), button:has-text('Preview')"
      timeout_ms: 30000
    - type: browser.click
      selector: "a:has-text('Preview'), button:has-text('Preview')"
      timeout_ms: 10000
    - type: control.sleep
      duration: 3000
    - type: browser.wait_for_element
      selector: "button.absolute.bottom-0.left-1\\/2.-translate-x-1\\/2.rounded-full"
      timeout_ms: 60000
    - type: control.sleep
      duration: 5000
    - type: browser.click
      selector: "button.absolute.bottom-0.left-1\\/2.-translate-x-1\\/2.rounded-full"
      timeout_ms: 10000
    - type: browser.wait_for_element
      selector: "button.absolute.bottom-0.left-1\\/2.-translate-x-1\\/2.rounded-full.bg-red-500"
      timeout_ms: 60000
    - type: control.log
      message: 'ElevenLabs conversation started with agent: ${params.agent_name}'

  # Enter via direct agent URL
  enter:agent_url:
    - type: browser.wait_for_element
      selector: "a:has-text('Preview'), button:has-text('Preview')"
      timeout_ms: 30000
    - type: browser.click
      selector: "a:has-text('Preview'), button:has-text('Preview')"
      timeout_ms: 10000
    - type: control.sleep
      duration: 3000
    - type: browser.wait_for_element
      selector: "button.absolute.bottom-0.left-1\\/2.-translate-x-1\\/2.rounded-full"
      timeout_ms: 60000
    - type: control.sleep
      duration: 5000
    - type: browser.click
      selector: "button.absolute.bottom-0.left-1\\/2.-translate-x-1\\/2.rounded-full"
      timeout_ms: 10000
    - type: browser.wait_for_element
      selector: "button.absolute.bottom-0.left-1\\/2.-translate-x-1\\/2.rounded-full.bg-red-500"
      timeout_ms: 60000
    - type: control.log
      message: 'ElevenLabs conversation started with direct agent URL'

  # Exit: End conversation
  exit:
    - type: browser.click
      selector: "button.absolute.bottom-0.left-1\\/2.-translate-x-1\\/2.rounded-full.bg-red-500"
      timeout_ms: 10000
      force: true
    - type: control.sleep
      duration: 2000
    - type: control.log
      message: ElevenLabs conversation ended

  # Exit: End public demo widget call
  exit:public:
    - type: browser.click
      selector: button.tw-size-12.tw-bg-black.tw-text-white
      timeout_ms: 10000
      force: true
    - type: browser.wait_for_element
      selector: button[aria-label='Start call']
      timeout_ms: 30000
    - type: control.log
      message: ElevenLabs conversation ended (public mode)
