---
# LiveKit Platform Configuration
#
# Platform: LiveKit Agents Playground
# URL: https://livekit.io/
# Authentication: Not required (public demo)
name: livekit
description: LiveKit Voice AI Playground (Public Demo)
config:
  url: https://livekit.com/
auth:
  default_mode: public
  auto_fallback: [public]
actions:
  # Setup: Navigate to playground
  setup:public:
    - type: browser.navigate
      url: ${config.url}
      wait_until: domcontentloaded
      timeout_ms: 60000
    - type: control.sleep
      duration: 5000
    - type: control.log
      message: LiveKit page loaded

  # Enter: Start conversation
  enter:
    - type: browser.click
      selector: button:has-text('Talk to LiveKit Agent')
      timeout_ms: 10000
    - type: control.log
      message: LiveKit session started

  # Active check: the destructive/end button appears after the session connects.
  wait_for_active:
    - type: browser.wait_for_element
      selector: button[data-variant='destructive']
      state: visible
      timeout_ms: 30000
    - type: control.sleep
      duration: 1000
    - type: control.log
      message: LiveKit session active

  # Exit: End session
  exit:
    - type: browser.click
      selector: button[data-variant='destructive']
      timeout_ms: 5000
    - type: control.log
      message: LiveKit session ended
